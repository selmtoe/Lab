<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>テトリス資料庫 · LAB</title><script>
try { document.documentElement.dataset.labTheme = localStorage.getItem('lab-appearance-mode') === 'dark' ? 'dark' : 'light'; }
catch { document.documentElement.dataset.labTheme = 'light'; }
</script><link rel="stylesheet" href="library.css?v=20260914-analysis2"><link rel="icon" href="data:,"></head>
<body><header><a href="./index.html">LAB</a><strong>テトリス資料庫</strong><span id="access">読み込み中</span></header>
<main><div class="toolbar"><label>資料を探す<input id="search" type="search" placeholder="選手、タグ、動画、時刻付きメモから検索"></label><label>種類<select id="kind"><option value="">すべて</option><option value="match">解析した試合</option><option value="video">動画</option><option value="article">記事</option><option value="tetofu">テト譜</option></select></label><label>解析結果<select id="status"><option value="">すべて</option><option value="complete">解析成功</option><option value="failed">解析失敗</option></select></label></div>
<div id="owner" class="actions" hidden><button id="add">新しく登録</button><a href="./index.html">完成結果の取り込みはホームから</a><button id="bulk" class="secondary">表示中の試合をまとめて設定</button><button id="publish" class="secondary">公開する内容を確認</button><button id="backup" class="secondary">バックアップ</button><button id="trash" class="secondary">ごみ箱</button></div>
<p id="message" role="status" aria-live="polite"></p><div id="jobs"></div><div class="workspace"><section aria-label="資料一覧"><div id="counts"></div><div id="list"></div></section><section id="detail" aria-label="選択した資料"><p class="empty">一覧から資料を選択してください。</p></section></div></main>
<dialog id="form"><form id="edit"><h2>資料を編集</h2><input name="id" type="hidden"><input name="revision" type="hidden"><label>タイトル<input name="title" required maxlength="250"></label><label>種類<select name="kind"><option value="article">記事</option><option value="video">動画</option><option value="tetofu">テト譜</option><option value="match">解析した試合</option></select></label><label>タグ（カンマ区切り）<input name="tags"></label><label>説明<input name="description" maxlength="1000"></label><label>本文・メモ<textarea name="content" rows="9"></textarea></label><label>外部リンク・シミュレーターのURL<input name="url" type="url"></label><label>YouTubeのURL<input name="youtubeUrl" type="url" placeholder="https://www.youtube.com/watch?v=..."></label><label>公開範囲<select name="visibility"><option value="private">このPCだけ</option><option value="public">公開する</option></select></label><p class="meta">「公開する」にした資料は、公開内容の確認画面からサイトに反映できます。動画ファイルは送りません。</p><div class="actions"><button type="submit">保存する</button><button type="button" class="secondary" data-close="form">閉じる</button><button type="button" class="secondary" id="delete">ごみ箱に移す</button></div></form></dialog>
<dialog id="publication"><h2>公開する資料</h2><p>以下の資料と「公開する」にした時刻付きメモを公開します。元動画・解析の途中データ・非公開の資料は含めません。</p><p id="publication-count"></p><div id="publication-list"></div><div class="actions"><button id="publish-now">Labに公開する</button><button class="secondary" id="export">公開用ファイルだけ保存</button><button class="secondary" data-close="publication">閉じる</button></div><p id="publication-message" role="status"></p></dialog>
<dialog id="bulk-dialog"><form id="bulk-form"><h2>表示中の試合をまとめて設定</h2><p id="bulk-count"></p><div id="bulk-list"></div><label>YouTubeのURL（空欄なら変更しません）<input name="youtube" type="url"></label><label>追加するタグ（カンマ区切り）<input name="tags"></label><label>公開範囲<select name="visibility"><option value="">変更しない</option><option value="private">このPCだけ</option><option value="public">公開する</option></select></label><p class="meta">検索や絞り込みで対象の試合を選んでから使えます。実際の公開は「公開する内容を確認」から行います。</p><div class="actions"><button type="submit">表示した試合に適用する</button><button type="button" class="secondary" data-close="bulk-dialog">閉じる</button></div></form></dialog>
<script src="data/tetris-event-codec.js"></script><script type="module" src="library.js?v=20260914-analysis2"></script></body></html>
